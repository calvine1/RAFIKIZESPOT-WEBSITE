<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111722">
    <meta name="description" content="Explore moments of worship, fellowship, outreach and community with Rafiki Zespół.">
    <title>Gallery | Rafiki Zespół</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/pages-extra.css">
    <script src="/assets/js/main.js" defer></script>
</head>
<body>
    <div data-include="header"></div>

    <main>

        <section class="inner-hero extra-hero">
            <div class="container">
                <span class="eyebrow">MOMENTS THAT MATTER</span>
                <h1>Our <span>Gallery.</span></h1>
                <p>A glimpse into our worship, fellowship, outreach and the memories we continue to create together.</p>
            </div>
        </section>

        <section class="extra-section">
            <div class="container">
                <div class="extra-heading">
                    <span class="eyebrow">LIFE AT RAFIKI</span>
                    <h2>Moments. Memories. Ministry.</h2>
                    <p>Every picture tells a story of friendship, faith and service.</p>
                </div>

                <div class="gallery-grid">
                    <figure class="gallery-item gallery-large">
                        <img src="/assets/images/community/community-hero.jpg" alt="Rafiki Zespół community gathering" loading="lazy">
                        <figcaption>Our Community</figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <img src="/assets/images/community/community-fellowship.jpg" alt="Community fellowship" loading="lazy">
                        <figcaption>Fellowship</figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <img src="/assets/images/community/outreach-service.jpg" alt="Community outreach and service" loading="lazy">
                        <figcaption>Outreach & Service</figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <img src="/assets/images/community/community-worship.jpg" alt="Worship and ministration" loading="lazy">
                        <figcaption>Worship</figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <img src="/assets/images/community/community-creativity.jpg" alt="Creative community activities" loading="lazy">
                        <figcaption>Creativity</figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <img src="/assets/images/community/gallery-fellowship.jpg" alt="Friends sharing fellowship" loading="lazy">
                        <figcaption>Friendship</figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <img src="/assets/images/community/gallery-worship.jpg" alt="Worship gathering" loading="lazy">
                        <figcaption>Ministration</figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <img src="/assets/images/community/gallery-service.jpg" alt="Serving together" loading="lazy">
                        <figcaption>Serving Together</figcaption>
                    </figure>
                    <figure class="gallery-item">
                        <img src="/assets/images/community/gallery-team.jpg" alt="Rafiki Zespół team" loading="lazy">
                        <figcaption>The Team</figcaption>
                    </figure>
                </div>
            </div>
        </section>

    </main>

    <div data-include="footer"></div>
</body>
</html>
